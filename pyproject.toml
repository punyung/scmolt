[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scmolt"
version = "0.1.0"
description = "Leakage-audited latent transport for single-cell mosaic multi-omics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "scmidas==0.1.13",
  "torch>=2.5.1,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
frozenbridge65 = [
  "h5py==3.14.0",
  "lightning==2.6.0",
  "natsort>=8.4,<9",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "PyYAML==6.0.3",
  "scikit-learn==1.6.1",
  "scipy==1.13.1",
  "scmidas==0.1.13",
  "toml==0.10.2",
  "torch==2.8.0",
]
test = ["pytest>=8,<9"]

[project.scripts]
scmolt = "scmolt.cli:main"
scmolt-frozenbridge65-train = "scmolt.frozenbridge65.train:main"
scmolt-frozenbridge65-predict = "scmolt.frozenbridge65.predict:main"
scmolt-frozenbridge65-validate = "scmolt.frozenbridge65.validate:main"
scmolt-frozenbridge65-make-tiny-input = "scmolt.frozenbridge65.make_tiny_input:main"

[project.urls]
Repository = "https://github.com/punyung/scmolt"
Issues = "https://github.com/punyung/scmolt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scmolt.configs" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
