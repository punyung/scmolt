[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scmolt"
version = "1.0.0"
description = "Gaussian posterior transport for mosaic integration of single-cell multi-omics data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rong Pan" }, { name = "Tianzhou Ma" }]
requires-python = ">=3.10,<3.13"
keywords = ["single-cell", "multi-omics", "mosaic integration", "variational autoencoder", "CITE-seq", "ATAC-seq"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "scmidas==0.1.13",
  "torch>=2.5.1,<3",
  "anndata>=0.10",
  "h5py>=3.10",
  "lightning>=2.4,<2.7",
  "natsort>=8.4,<9",
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "toml>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
scmolt = "scmolt.cli:main"
scmolt-train = "scmolt.frozenbridge65.train:main"
scmolt-predict = "scmolt.frozenbridge65.predict:main"
scmolt-make-tiny-input = "scmolt.frozenbridge65.make_tiny_input:main"
scmolt-anchor-train = "scmolt.anchor_conditioned.train:main"
scmolt-anchor-predict = "scmolt.anchor_conditioned.predict:main"
scmolt-anchor-make-tiny-input = "scmolt.anchor_conditioned.make_tiny_input:main"

[project.urls]
Homepage = "https://github.com/punyung/scmolt"
Issues = "https://github.com/punyung/scmolt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scmolt.configs" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
