name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest
          python -m pip install --no-deps -e .
      - name: Test
        run: pytest
      - name: Audit publication tree
        run: python scripts/audit_repository.py .
      - name: Verify feature contract
        run: scmolt verify-features .
