name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Test
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest
      - name: Quick start
        env:
          PYTHONHASHSEED: "1234"
        run: |
          scmolt info
          scmolt-make-tiny-input --output-dir "$RUNNER_TEMP/tiny_input"
          scmolt-train --input-dir "$RUNNER_TEMP/tiny_input" --output-dir "$RUNNER_TEMP/tiny_run" --device cpu --threads 2 --allow-runtime-drift
